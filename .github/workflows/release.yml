name: Publicar MailDesk para Windows

on:
  push:
    branches:
      - main
    paths:
      - 'release-version.txt'
      - '.github/workflows/release.yml'
      - 'MailDesk-source-v*.zip'
  workflow_dispatch:
    inputs:
      version:
        description: 'Versión que se va a compilar (por ejemplo, v0.4.0)'
        required: true
        default: 'v0.4.0'

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - name: Descargar el código
        uses: actions/checkout@v4

      - name: Preparar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Extraer el código de la versión
        shell: pwsh
        run: |
          $version = "${{ inputs.version }}"
          if ([string]::IsNullOrWhiteSpace($version)) {
            if ("${{ github.ref_type }}" -eq "tag") {
              $version = "${{ github.ref_name }}"
            } else {
              $version = (Get-Content "release-version.txt" -Raw).Trim()
            }
          }
          if ($version -notmatch '^v\d+\.\d+\.\d+$') {
            throw "Versión no válida: $version"
          }
          $archive = "MailDesk-source-$version.zip"
          if (-not (Test-Path $archive)) {
            throw "No se encuentra $archive"
          }
          Expand-Archive -Path $archive -DestinationPath app -Force

      - name: Crear la etiqueta de la versión
        if: github.ref_type != 'tag'
        shell: pwsh
        run: |
          $version = "${{ inputs.version }}"
          if ([string]::IsNullOrWhiteSpace($version)) {
            $version = (Get-Content "release-version.txt" -Raw).Trim()
          }
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git ls-remote --exit-code --tags origin "refs/tags/$version"
          if ($LASTEXITCODE -ne 0) {
            git tag $version
            git push origin $version
          }

      - name: Instalar dependencias
        working-directory: app
        shell: pwsh
        run: |
          if (Test-Path package-lock.json) {
            npm ci
          } else {
            npm install
          }

      - name: Comprobar el código
        working-directory: app
        run: npm run check

      - name: Compilar para Windows
        working-directory: app
        run: npm run dist:win

      - name: Publicar el instalador y la actualización
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $version = "${{ inputs.version }}"
          if ([string]::IsNullOrWhiteSpace($version)) {
            $version = (Get-Content "release-version.txt" -Raw).Trim()
          }
          $installer = Get-ChildItem -Path "app/release" -Filter "MailDesk-Setup-*.exe" | Where-Object { $_.Name -notmatch '__uninstaller' } | Select-Object -First 1
          if (-not $installer) { throw "No se encuentra el instalador de Windows." }
          $blockMap = "$($installer.FullName).blockmap"
          $latest = "app/release/latest.yml"
          if (-not (Test-Path $blockMap) -or -not (Test-Path $latest)) { throw "Faltan archivos de actualización." }
          gh release view $version --repo "${{ github.repository }}" 2>$null
          if ($LASTEXITCODE -ne 0) {
            gh release create $version --repo "${{ github.repository }}" --title "MailDesk $version"
          }
          gh release upload $version $installer.FullName $blockMap $latest --clobber --repo "${{ github.repository }}"

