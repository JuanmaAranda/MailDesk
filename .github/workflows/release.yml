name: Publicar MailDesk para Windows

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - name: Descargar el código
        uses: actions/checkout@v4

      - name: Preparar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Extraer el código de la versión
        shell: pwsh
        run: |
          $archive = "MailDesk-source-${{ github.ref_name }}.zip"
          if (-not (Test-Path $archive)) {
            throw "No se encuentra $archive"
          }
          Expand-Archive -Path $archive -DestinationPath app -Force

      - name: Instalar dependencias
        working-directory: app
        run: npm ci

      - name: Comprobar el código
        working-directory: app
        run: npm run check

      - name: Compilar y publicar
        working-directory: app
        run: npm run publish
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
